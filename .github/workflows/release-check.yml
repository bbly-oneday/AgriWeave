name: Release integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source hashes, syntax and public file scope
        run: python -B tempscript/check_release.py
